@switch (lessonsQuery.status()) { @case ("pending") {
<div class="flex items-center justify-center gap-2">
  <i class="ph ph-spinner-gap text-2xl animate-spin"></i>
  <span class="">در حال بارگذاری...</span>
</div>
} @case ("error") {
<div class="flex flex-col items-center justify-center text-center gap-2">
  <i class="ph-fill ph-warning-circle text-3xl text-destructive"></i>
  <p class="text-destructive">مشکلی پیش آمد...</p>
  <button hlmBtn variant="outline" (click)="lessonsQuery.refetch()">
    <span>تلاش مجدد</span>
    <i class="ph-fill ph-arrow-counter-clockwise text-lg"></i>
  </button>
</div>
} @case ("success") {
<h1 class="text-3xl font-black text-center">
  <span>بوت‌کد؛ </span>
  <br />
  <span>بوت‌کمپ 👨🏻‍💻 کدنویسی</span>
</h1>

<div class="flex flex-col gap-2 w-full flex-1">
  @for (lesson of lessonsQuery.data()!.items; track lesson.id) {
  <a
    hlmCard
    [routerLink]="getLessonUrl(lesson.id)"
    class="flex items-center gap-2 p-4 cursor-pointer hover:bg-accent flex-row w-full"
  >
    <ng-icon name="phosphorNotebook" size="24" />
    <h3 hlmCardTitle class="flex-1">{{ lesson.title }}</h3>

    <ng-icon name="phosphorCaretLeft" size="24" />
  </a>
  }
</div>
} }
